# Что уходит на сайт.
#
# Публикация идёт из корня основной ветки, и по умолчанию наружу отдаётся
# всё содержимое репозитория. Наружу должна смотреть только книга: сам
# index.html, иконки и картинка превью.
#
# Рабочие файлы лежат в каталоге `_rabota`. Каталоги, чьё имя начинается
# с подчёркивания, не публикуются, поэтому новый файл достаточно положить
# туда — вписывать его сюда не нужно.
#
# Ниже перечислено то, что обязано остаться в корне: README открывает
# страницу репозитория, CLAUDE.md подхватывается по имени, знаки лежат
# рядом с книгой. На сайте им делать нечего.

exclude:
  - README.md
  - CLAUDE.md
  - logo.svg
  - avatar-512.png
